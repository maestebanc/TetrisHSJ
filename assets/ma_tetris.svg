<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="50%" stop-color="#101f33"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#cc0022"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="8"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Circuit traces in background -->
  <path d="M 60 120 L 140 120 L 180 160 M 452 120 L 372 120 L 332 160 M 60 380 L 140 380 L 180 340 M 452 380 L 372 380 L 332 340" 
        stroke="#00e5ff" stroke-width="4" stroke-opacity="0.35" fill="none"/>
  <circle cx="60" cy="120" r="6" fill="#00e5ff" opacity="0.6"/>
  <circle cx="452" cy="120" r="6" fill="#00e5ff" opacity="0.6"/>
  <circle cx="60" cy="380" r="6" fill="#00e5ff" opacity="0.6"/>
  <circle cx="452" cy="380" r="6" fill="#00e5ff" opacity="0.6"/>

  <!-- Hospital Medical Cross -->
  <g filter="url(#neonGlow)">
    <!-- Horizontal arm -->
    <rect x="156" y="196" width="200" height="72" rx="16" fill="url(#crossGrad)" stroke="#ff6677" stroke-width="3"/>
    <!-- Vertical arm -->
    <rect x="220" y="132" width="72" height="200" rx="16" fill="url(#crossGrad)" stroke="#ff6677" stroke-width="3"/>
    <!-- Microchip Center Core -->
    <rect x="232" y="208" width="48" height="48" rx="10" fill="#00e5ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="256" cy="232" r="8" fill="#ffffff"/>
  </g>

  <!-- ECG Waveform line -->
  <path d="M 60 270 L 140 270 L 155 285 L 170 230 L 185 310 L 200 270 L 220 270" 
        stroke="#00e676" stroke-width="5" fill="none" filter="url(#neonGlow)"/>
  <path d="M 292 270 L 320 270 L 335 255 L 350 290 L 365 240 L 380 270 L 452 270" 
        stroke="#00e676" stroke-width="5" fill="none" filter="url(#neonGlow)"/>

  <!-- Tetris blocks foundation -->
  <g transform="translate(106, 370)">
    <!-- T piece (purple) -->
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#a828f0" stroke="#d580ff" stroke-width="2"/>
    <rect x="34" y="0" width="30" height="30" rx="4" fill="#a828f0" stroke="#d580ff" stroke-width="2"/>
    <rect x="68" y="0" width="30" height="30" rx="4" fill="#a828f0" stroke="#d580ff" stroke-width="2"/>
    <rect x="34" y="-34" width="30" height="30" rx="4" fill="#a828f0" stroke="#d580ff" stroke-width="2"/>

    <!-- I piece (cyan) -->
    <rect x="110" y="0" width="30" height="30" rx="4" fill="#00e5ff" stroke="#a0f8ff" stroke-width="2"/>
    <rect x="144" y="0" width="30" height="30" rx="4" fill="#00e5ff" stroke="#a0f8ff" stroke-width="2"/>
    <rect x="178" y="0" width="30" height="30" rx="4" fill="#00e5ff" stroke="#a0f8ff" stroke-width="2"/>
    <rect x="212" y="0" width="30" height="30" rx="4" fill="#00e5ff" stroke="#a0f8ff" stroke-width="2"/>

    <!-- S piece (green) -->
    <rect x="254" y="0" width="30" height="30" rx="4" fill="#00e676" stroke="#80ffb7" stroke-width="2"/>
    <rect x="288" y="0" width="30" height="30" rx="4" fill="#00e676" stroke="#80ffb7" stroke-width="2"/>
    <rect x="288" y="-34" width="30" height="30" rx="4" fill="#00e676" stroke="#80ffb7" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="256" y="96" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="44" fill="#00e5ff" letter-spacing="4">MA TETRIS</text>
  <text x="256" y="455" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="2">HOSPITAL DE SANT JOAN</text>
  <text x="256" y="480" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="14" fill="#ffb300" letter-spacing="1">UNIDAD DE INFORMÁTICA &amp; TIC</text>
</svg>
